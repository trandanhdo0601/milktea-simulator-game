spring:
  datasource:
    # Mặc định: H2 nhúng sẵn — không cần bất kỳ dịch vụ database bên ngoài nào.
    # Khi deploy với MySQL thật: đặt biến môi trường SPRING_DATASOURCE_URL,
    # SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
    # JPA_DDL_AUTO=validate, FLYWAY_ENABLED=true
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:milk_tea_game;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    # driver-class-name được Spring Boot tự phát hiện từ URL (h2:// hoặc mysql://)

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  flyway:
    # Chỉ bật Flyway khi dùng MySQL thật (đặt FLYWAY_ENABLED=true trên Render)
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: false

server:
  port: ${SERVER_PORT:${PORT:8080}}

app:
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET:bWlsa1RlYUdhbWVTZWNyZXRLZXlGb3JKV1RBdXRoZW50aWNhdGlvbjIwMjQ=}}
    expiration: ${APP_JWT_EXPIRATION:${JWT_EXPIRATION:86400000}}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:*}}

logging:
  level:
    com.example.milkteagame: INFO
    org.springframework.security: INFO
